<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Levé Topo · MT Line</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        /* ── Backgrounds (OLED dark) ── */
        --bg:        #020617;
        --surface:   #0c1524;
        --surface2:  #111e30;
        --surface3:  #172438;

        /* ── Borders ── */
        --border:    #1b2b40;
        --border2:   #243348;

        /* ── Brand accent (survey cyan) ── */
        --accent:    #22d3ee;
        --accent-dim: rgba(34,211,238,0.1);

        /* ── Semantic status ── */
        --green:     #22c55e;
        --amber:     #f59e0b;
        --red:       #ef4444;
        --blue:      #3b82f6;
        --purple:    #a78bfa;

        /* ── Text ── */
        --text:      #f1f5f9;
        --text2:     #8fa4bf;
        --text3:     #4a6278;

        /* ── Design tokens ── */
        --sidebar-w: 240px;
        --header-h:  56px;
        --radius:    10px;
        --radius-sm: 7px;
        --gap:       12px;
        --card-pad:  16px 18px;
      }

      html, body, #root { height: 100%; min-height: 100dvh; }

      body {
        background: var(--bg);
        background-image:
          radial-gradient(ellipse 55% 30% at 50% 0%, rgba(34,211,238,0.05) 0%, transparent 50%);
        color: var(--text);
        font-family: 'Fira Sans', system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .mono, code { font-family: 'Fira Code', 'Cascadia Code', monospace; }

      input, select, textarea, button { font-family: inherit; touch-action: manipulation; }
      a { color: inherit; text-decoration: none; }

      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

      ::selection { background: rgba(34,211,238,0.18); color: var(--accent); }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
